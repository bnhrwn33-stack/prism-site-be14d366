<!DOCTYPE html>
<html lang="he" dir="rtl"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שלום</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Outfit:wght@200;300;400&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf9f6;
      --fg: #1e1c19;
      --muted: #8b867d;
      --line: #e8e3da;
      --accent: #b8860b;
      --radius: 1rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141311;
        --fg: #faf8f4;
        --muted: #9a948a;
        --line: #2a2722;
        --accent: #d4a843;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      display: grid;
      place-items: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    /* קו עדין אלכסוני ברקע */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 40px,
          var(--line) 40px,
          var(--line) 41px
        );
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }
    .logo-corner {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--line);
      box-shadow: 0 2px 12px rgba(30,28,25,0.06);
      opacity: 0.7;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 1;
    }
    .logo-corner:hover {
      opacity: 1;
      transform: scale(1.05) rotate(-2deg);
    }
    main {
      text-align: center;
      z-index: 1;
      max-width: 90vw;
    }
    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(3rem, 12vw, 7rem);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      opacity: 0;
      transform: translateY(20px);
      animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    h1 span {
      display: block;
      font-family: 'Outfit', sans-serif;
      font-weight: 200;
      font-size: clamp(1rem, 3vw, 1.5rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.75rem;
      opacity: 0;
      transform: translateY(10px);
      animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
    }
    .accent-line {
      width: 60px;
      height: 2px;
      background: var(--accent);
      margin: 2rem auto 0;
      border-radius: 1px;
      transform: scaleX(0);
      transform-origin: center;
      animation: grow 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
    }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes grow {
      to { transform: scaleX(1); }
    }
    @media (max-width: 480px) {
      .logo-corner { width: 56px; height: 56px; top: 1rem; right: 1rem; }
      .accent-line { width: 48px; }
    }
  </style>
</head>
<body class="">
  <img src="uploads/9467cb6c52.png" alt="לוגו" class="logo-corner" loading="eager">
  <main class="">
    <h1 class="" style="font-size: 68px;">שלום<span class="" style="padding: 0px; font-size: 21px;">ברוכים הבאים</span></h1>
    <div class="accent-line" aria-hidden="true" style="font-size: 8px; padding: 2px; border-radius: 0px;"></div>
  </main>

</body></html>
